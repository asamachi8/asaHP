<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コンタクトページ｜asaHPエディター</title>
<link rel="stylesheet" href="../css/editor-tools.css">
<style>
  :root {
    --bg: #101010; --panel: #1a1a1a; --panel-2: #202020;
    --border: #3a3a3a; --text: #e8e8e8; --dim: #9a9a9a; --accent: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  body { padding: 16px 16px 60px; }

  .lead { color: var(--dim); font-size: 12px; margin: 0 0 18px; line-height: 1.8; }
  .lead code { color: var(--text); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0; }
  .btn {
    font-size: 12px; padding: 7px 14px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.danger:hover { border-color: #d66; }
  #status { font-size: 12px; color: var(--dim); }

  section { margin-bottom: 26px; }
  section h2 {
    font-size: 13px; letter-spacing: 0.04em; margin: 0 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border); color: var(--text);
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 11px; color: var(--dim); }
  .field input[type="text"], .field input[type="number"], .field textarea, .field select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 8px; border-radius: 3px; font-size: 13px; font-family: inherit; width: 100%;
  }
  .field textarea { min-height: 64px; resize: vertical; }

  .item-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 12px; margin-bottom: 10px;
  }
  .item-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px;
  }
  .item-head .badge { font-size: 11px; color: var(--dim); }
  .item-head label { font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 700px) { .row3 { grid-template-columns: 1fr; } }

  textarea#outputCode {
    width: 100%; min-height: 220px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px; padding: 12px; font-size: 12px;
    font-family: Consolas, Menlo, monospace; white-space: pre;
  }
</style>
</head>
<body>

<p class="lead">
  CONTACTページ（<code>contact.html</code>）の内容を編集します。
</p>

<section>
  <h2>ページ背景</h2>
  <div class="grid2">
    <div class="field">
      <label for="contactBg">背景画像</label>
      <input type="text" id="contactBg" placeholder="assets/images/contact_bg.jpg" data-picker="images">
    </div>
    <div class="field">
      <label for="contactOverlay">背景を暗くする度合い（0〜1）</label>
      <input type="number" id="contactOverlay" min="0" max="1" step="0.05">
    </div>
  </div>
</section>

<section>
  <h2>説明文（フォーム上部の案内）</h2>
  <div class="field"><textarea id="leadText"></textarea></div>
</section>

<section>
  <h2>記入項目</h2>
  <div id="fieldList"></div>
  <button type="button" class="btn" id="addFieldBtn">＋ 項目を追加</button>
</section>

<section>
  <h2>依頼用テンプレート</h2>
  <p class="lead" style="margin:0 0 8px;">記入項目のうち「テンプレートボタンを付ける」にチェックした項目に、このボタンで挿入されます。</p>
  <div class="field"><textarea id="requestTemplate" style="min-height:120px;"></textarea></div>
</section>

<section>
  <h2>Googleフォーム連携</h2>
  <div class="field" style="margin-bottom:12px;">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);">
      <input type="checkbox" id="formPublished"> お問い合わせフォームを表示する
    </label>
  </div>
  <p class="lead" style="margin:0 0 12px;">
    チェックを外すと、CONTACTページから記入欄と送信ボタンがなくなり、
    下の案内文だけが表示されます。Googleフォームの準備ができるまではオフにしておくと安心です。
  </p>
  <div class="field">
    <label for="closedText">フォームを表示しないときの案内文</label>
    <textarea id="closedText" style="min-height:60px;"></textarea>
  </div>
  <div class="field">
    <label for="actionUrl">送信先URL（フォームID入りの formResponse URL）</label>
    <input type="text" id="actionUrl">
  </div>
</section>

<p class="lead">
  編集した内容は、asaHPエディター左上の「変更をすべて保存」から保存してください。
</p>

<script src="../data/config.js"></script>
<script src="../js/save-api.js"></script>
<script src="../js/file-picker.js"></script>
<script src="../js/config-serializer.js"></script>
<script src="../js/contact-editor.js"></script>
</body>
</html>
