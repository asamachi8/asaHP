<style>
  .notfound-page {
    max-width: 620px;
    margin: 0 auto;
    padding: 90px 20px;

  }
  .notfound-number {
    font-family: var(--font-serif);
    font-size: clamp(56px, 14vw, 96px);
    line-height: 1;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin: 0;
  }
  .notfound-page h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(16px, 4vw, 20px);
    letter-spacing: 0.1em;
    color: var(--gold-bright);
    margin: 18px 0 0;
  }
  .notfound-text {
    color: var(--cream-dim);
    font-size: 14px;
    line-height: 2;
    margin: 16px 0 34px;
  }
  .notfound-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .notfound-links a {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-decoration: none;
    padding: 10px 20px;
    color: var(--cream);
    background: var(--panel);
    border: 1px solid rgba(138, 106, 47, 0.7);
    border-radius: 2px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .notfound-links a:hover,
  .notfound-links a:focus-visible { border-color: var(--gold); color: var(--gold-bright); }
</style>
