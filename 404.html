<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜幻想肖像画美術館</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f141d'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23cfa958' stroke-width='2'/%3E%3C/svg%3E">
<!-- このページはサイトのどの階層で表示されるか分からないため、
     外部ファイルを一切読み込まず、見た目をすべてこの中に書いています。 -->
<style>
  :root {
    --wall-dark: #0f141d;
    --wall: #161f2c;
    --panel: #131a24;
    --gold: #cfa958;
    --gold-bright: #e9d9a8;
    --cream: #efe6d4;
    --cream-dim: #b9ae98;
    --font-serif: Georgia, "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    --font-body: "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 60px 20px;
    font-family: var(--font-body);
    line-height: 1.7;
    color: var(--cream);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(207, 169, 88, 0.1), transparent 55%),
      linear-gradient(180deg, var(--wall-dark), var(--wall) 45%, var(--wall-dark));
  }
  .notfound { max-width: 620px; text-align: center; }
  .notfound-number {
    font-family: var(--font-serif);
    font-size: clamp(56px, 14vw, 96px);
    line-height: 1;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin: 0;
  }
  .notfound h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(16px, 4vw, 20px);
    letter-spacing: 0.1em;
    color: var(--gold-bright);
    margin: 18px 0 0;
  }
  .notfound-text {
    color: var(--cream-dim);
    font-size: 14px;
    line-height: 2;
    margin: 16px 0 34px;
  }
  .notfound-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .notfound-links a {
    font-family: var(--font-serif);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-decoration: none;
    padding: 10px 20px;
    color: var(--cream);
    background: var(--panel);
    border: 1px solid rgba(138, 106, 47, 0.7);
    border-radius: 2px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .notfound-links a:hover,
  .notfound-links a:focus-visible { border-color: var(--gold); color: var(--gold-bright); }
  :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
</style>
</head>
<body>

<div class="notfound">
  <p class="notfound-number">404</p>
  <h1>この額縁は、まだ飾られていません</h1>
  <p class="notfound-text">
    お探しのページは見つかりませんでした。<br>
    住所が変わったか、もともと存在しないページかもしれません。
  </p>
  <nav class="notfound-links" id="notfoundLinks" aria-label="サイト内ナビゲーション">
    <a href="./" data-page="">HOME</a>
    <a href="./about.html" data-page="about.html">ABOUT</a>
    <a href="./topics.html" data-page="topics.html">TOPICS</a>
    <a href="./contact.html" data-page="contact.html">CONTACT</a>
  </nav>
</div>

<script>
// GitHub Pages では、存在しないURLならどんな深さでもこのページが表示されます。
// そのままだとリンクが迷子になるので、いまのURLからサイトの入口を割り出して貼り直します。
(function () {
  "use strict";
  var parts = location.pathname.split("/");
  // 「ユーザー名.github.io/リポジトリ名/…」の形のときは、リポジトリ名までが入口
  var base = "/";
  if (/\.github\.io$/i.test(location.hostname) && parts.length > 2 && parts[1]) {
    base = "/" + parts[1] + "/";
  }
  var links = document.getElementById("notfoundLinks");
  if (!links) return;
  Array.prototype.forEach.call(links.querySelectorAll("a"), function (a) {
    a.href = base + a.getAttribute("data-page");
  });
})();
</script>

</body>
</html>
