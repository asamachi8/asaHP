<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABOUT｜幻想肖像画美術館</title>
<meta name="description" content="幻想肖像画美術館 ポートフォリオ 自己紹介ページ">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f141d'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23cfa958' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-about">

<div class="about-page">

  <nav class="site-nav" aria-label="サイト内ナビゲーション">
    <a href="index.html">HOME</a>
    <a href="about.html" class="is-current">ABOUT</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <div class="about-card" id="aboutCard">

    <div class="portrait-frame" id="portraitFrame">
      <span class="frame-outer">
        <span class="frame-inner">
          <img id="portraitImage" src="assets/images/portrait_voice.svg" alt="肖像画">
        </span>
      </span>
      <span class="portrait-toggle-mark" aria-hidden="true">&#8635;</span>
      <span class="portrait-hint">姿を切り替える</span>
    </div>

    <div class="about-body">
      <div class="plaque">
        <h1 id="profileName">◯◯（芸名）</h1>
        <p class="profile-title" id="profileTitle">声優・ナレーター</p>
        <p class="profile-bio" id="profileBio">自己紹介文がここに入ります。</p>
      </div>

      <!-- 声の活動の姿のときに表示 -->
      <div class="voice-sample-panel" id="voiceSection" aria-label="VOICE SAMPLE">
        <span class="voice-sample-panel-label">VOICE SAMPLE</span>
        <div id="voiceSamplePanel"></div>
      </div>

      <!-- 美術館ガイドの姿のときに表示 -->
      <div class="attachment-gallery" id="attachmentGallery" aria-label="創作イラストなどの添付物">
        <span class="attachment-gallery-label">CREATIVE WORKS</span>
      </div>
    </div>

  </div>

</div>

<!-- 創作イラストなどの添付物を大きく見るための枠 -->
<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-backdrop" data-lightbox-close></div>

  <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="添付物の拡大表示">
    <div class="lightbox-stage" id="lightboxStage">
      <img id="lightboxImage" src="" alt="">
    </div>

    <div class="lightbox-bar">
      <p class="lightbox-title" id="lightboxTitle"></p>
      <div class="lightbox-actions">
        <button type="button" class="lightbox-btn" id="lightboxZoom">もっと拡大</button>
        <a class="lightbox-btn" id="lightboxLink" target="_blank" rel="noopener noreferrer" hidden>リンクを開く</a>
      </div>
    </div>

    <button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="前の作品">&#8249;</button>
    <button type="button" class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="次の作品">&#8250;</button>
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="閉じる">&#215;</button>
  </div>
</div>

<script src="data/config.js"></script>
<script src="js/common.js"></script>
<script src="js/about.js"></script>
</body>
</html>
